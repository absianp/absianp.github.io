name: Pipeline Offline Checks

# Content generation runs on the authenticated local systemd host.
# Never copy the host's ChatGPT credentials into GitHub Actions.
on:
  workflow_dispatch:
  push:
    paths:
      - 'automation-pipeline/**'
      - '.github/workflows/agent-cron.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r automation-pipeline/requirements.txt
      - name: Verify offline behavior
        working-directory: automation-pipeline
        run: python -m unittest discover -s tests -v
