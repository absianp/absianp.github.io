name: Daily Auto Blog Agent Run

on:
  schedule:
    # 매일 한국 시간 오전 7시 (UTC 22:00) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    name: Run Topic Harvester & Content Writer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'automation-pipeline/requirements.txt'

      - name: Install Python dependencies
        run: |
          pip install -r automation-pipeline/requirements.txt

      - name: Execute Pipeline Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python automation-pipeline/main_pipeline.py --mode auto --approve

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add blog-frontend/src/content/blog/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily scheduled post generated" && git push)
