name: Deploy Astro Blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    name: Build Astro Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'blog-frontend/package.json'

      - name: Install dependencies
        run: |
          cd blog-frontend
          npm install

      - name: Build with Astro
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: |
          cd blog-frontend
          npx astro build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog-frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Telegram on Success
        if: success()
        run: |
          MESSAGE="🚀 <b>[GitHub Actions 배포 성공]</b>%0A━━━━━━━━━━━━━━━━━━━━%0A📦 <b>저장소</b>: absianp/absianp.github.io%0A📌 <b>커밋</b>: ${{ github.event.head_commit.message }}%0A🌐 <b>배포 URL</b>: https://absianp.github.io%0A✅ <i>전체 포스팅 및 웹페이지 배포가 완료되었습니다!</i>"
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          MESSAGE="🚨 <b>[GitHub Actions 빌드/배포 실패 경보]</b>%0A━━━━━━━━━━━━━━━━━━━━%0A⚠️ GitHub Actions 파이프라인에서 오류가 발생했습니다.%0A🔍 <b>확인 링크</b>: https://github.com/absianp/absianp.github.io/actions"
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"
