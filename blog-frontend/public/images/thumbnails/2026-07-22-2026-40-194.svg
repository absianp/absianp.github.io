<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 테마별 배경 그라디언트 -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06281e" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021510" />
    </linearGradient>

    <!-- 악센트 그라디언트 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- 골드 텍스트 그라디언트 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- 우측 아트워크 패널 그라디언트 -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- 글로우 필터 -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- 카드 그림자 필터 -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. 배경 메인 -->
  <rect width="1200" height="630" fill="url(#mainBg)" />

  <!-- 2. 앰비언트 글로우 -->
  <circle cx="150" cy="120" r="280" fill="#34d399" opacity="0.12" filter="url(#glowFilter)" />
  <circle cx="1050" cy="480" r="320" fill="#34d399" opacity="0.14" filter="url(#glowFilter)" />

  <!-- 3. 테크 프레임 외곽 테두리 -->
  <rect x="36" y="36" width="1128" height="558" rx="28" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
  <rect x="44" y="44" width="1112" height="542" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- 4. 좌측 상단 브랜드 헤더 -->
  <g transform="translate(90, 85)">
    <!-- 앱시안 테크 로고 아이콘 -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5" filter="url(#dropShadow)" />
    <!-- 터미널 프롬프트 심볼 (>_) -->
    <path d="M12 16 L22 23 L12 30" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="24" y1="30" x2="34" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <text x="62" y="24" font-family="'Pretendard', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="-0.5">앱시안</text>
    <text x="135" y="24" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700" fill="#34d399" letter-spacing="-0.2">absian</text>
    <text x="62" y="42" font-family="'Pretendard', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">AI &amp; 테크 · 개발 실무 · 스마트 부업</text>
  </g>

  <!-- 5. 카테고리 태그 & 2026 테크 뱃지 -->
  <g transform="translate(90, 160)">
    <!-- 카테고리 뱃지 -->
    <rect x="0" y="0" width="180" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="24" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#a7f3d0">스마트 부업 &amp; 재테크</text>

    <!-- 테마 뱃지 -->
    <g transform="translate(192, 0)">
      <rect x="0" y="0" width="170" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
      <text x="16" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#ffffff">★ 고수익 부업 공식</text>
    </g>
  </g>

  <!-- 6. 메인 타이틀 (좌측 영역, 최대 3줄 깔끔 배치) -->
  <text x="90" y="275" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1.5" filter="url(#dropShadow)">
    <tspan x="90" dy="0">2026 디지털 부업 &amp; 온라인</tspan><tspan x="90" dy="58">패시브 인컴 실전 로드맵 40편</tspan>
  </text>

  <!-- 7. 핵심 요약 서브카피 박스 -->
  <g transform="translate(90, 465)">
    <rect x="0" y="0" width="580" height="54" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <!-- 좌측 포인트 바 -->
    <rect x="0" y="0" width="6" height="54" rx="3" fill="#34d399" />
    <text x="24" y="33" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#e2e8f0">2026 디지털 부업 &amp; 온라인 패시브 인컴 실전 로드맵 40편에 대한 체계적인 실무 적용 가이드, 비교 분석 표, ...</text>
  </g>

  <!-- 8. 하단 푸터 인포 -->
  <g transform="translate(90, 555)">
    <circle cx="6" cy="-5" r="4" fill="#10b981" />
    <text x="18" y="0" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#34d399">실무 코드 &amp; 팩트체크 완료</text>
    <text x="185" y="0" font-family="'Pretendard', sans-serif" font-size="14" font-weight="400" fill="#94a3b8">• absianp.github.io</text>
  </g>

  <!-- 9. 우측 전용 맞춤형 테마 일러스트레이션 아트워크 -->
  
        <!-- 스마트 부업 & 패시브 인컴 파이프라인 일러스트 -->
        <g transform="translate(940, 315)">
            <circle cx="0" cy="0" r="190" fill="#f43f5e" opacity="0.2" filter="url(#glowFilter)"/>
            <circle cx="0" cy="0" r="175" fill="#0f172a" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="8,6" opacity="0.8"/>
            <circle cx="0" cy="0" r="150" fill="url(#panelGrad)" stroke="#e11d48" stroke-width="2"/>

            <!-- 로켓 발사 심볼 (수익 급상승) -->
            <g transform="translate(-20, -10) rotate(-45)">
                <!-- 로켓 바디 -->
                <path d="M0 -40 C15 -20 18 10 15 30 L-15 30 C-18 10 -15 -20 0 -40 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
                <!-- 윈도우 -->
                <circle cx="0" cy="-5" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
                <!-- 날개 -->
                <path d="M-15 15 L-30 32 L-15 30 Z" fill="#f43f5e"/>
                <path d="M15 15 L30 32 L15 30 Z" fill="#f43f5e"/>
                <!-- 불꽃 -->
                <path d="M-10 32 Q0 55 10 32 Q0 45 -10 32" fill="#fbbf24"/>
            </g>

            <!-- 디지털 전자책(PDF) & 머니 박스 -->
            <g transform="translate(45, 20)">
                <rect x="-28" y="-35" width="56" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#dropShadow)"/>
                <text x="0" y="-10" font-family="'Pretendard', sans-serif" font-size="12" font-weight="900" fill="#fda4af" text-anchor="middle">PDF</text>
                <line x1="-18" y1="5" x2="18" y2="5" stroke="#64748b" stroke-width="2"/>
                <line x1="-18" y1="15" x2="8" y2="15" stroke="#64748b" stroke-width="2"/>
            </g>

            <!-- 하단 뱃지 -->
            <g transform="translate(0, 95)">
                <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
                <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="11" font-weight="900" fill="#ffe4e6" text-anchor="middle">PASSIVE INCOME BUNDLE</text>
            </g>
        </g>
        
</svg>